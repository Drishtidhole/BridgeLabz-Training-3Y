
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Validation</title>
</head>
<body>
    <h2>Login</h2>

    <form id="loginForm">
        <input id="username" placeholder="Username" required><br><br>
        <input id="password" type="password" placeholder="Password" required><br><br>
        <button type="submit">Login</button>
    </form>

    <p id="message"></p>

    <script>
        "use strict";

        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (username.length < 5) {
                message.textContent = "Username must contain at least 5 characters.";
            } else if (password.length < 8) {
                message.textContent = "Password must contain at least 8 characters.";
            } else if (!/[0-9]/.test(password)) {
                message.textContent = "Password must contain a number.";
            } else if (!/[A-Z]/.test(password)) {
                message.textContent = "Password must contain an uppercase letter.";
            } else if (!/[a-z]/.test(password)) {
                message.textContent = "Password must contain a lowercase letter.";
            } else if (!/[^A-Za-z0-9\s]/.test(password)) {
                message.textContent = "Password must contain a special character.";
            } else {
                message.textContent = "Login validation successful!";
            }
        });
    </script>
</body>
</html>
