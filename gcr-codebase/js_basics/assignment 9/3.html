
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive FAQ</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        .faq {
            border: 1px solid gray;
            padding: 15px;
            margin: 10px;
        }

        .answer {
            display: none;
        }
    </style>
</head>
<body>

<header>
    <h1>Frequently Asked Questions</h1>
</header>

<main>

    <section class="faq">
        <h3 class="question">What is jQuery?</h3>
        <p class="answer">jQuery is a JavaScript library.</p>
        <input type="text" placeholder="Your feedback">
    </section>

    <section class="faq">
        <h3 class="question">What is HTML?</h3>
        <p class="answer">HTML creates webpage structure.</p>
        <input type="text" placeholder="Your feedback">
    </section>

    <section class="faq">
        <h3 class="question">What is CSS?</h3>
        <p class="answer">CSS styles webpages.</p>
        <input type="text" placeholder="Your feedback">
    </section>

    <section class="faq">
        <h3 class="question">What is JavaScript?</h3>
        <p class="answer">JavaScript adds interactivity.</p>
        <input type="text" placeholder="Your feedback">
    </section>

    <section class="faq">
        <h3 class="question">What is AJAX?</h3>
        <p class="answer">AJAX allows asynchronous communication.</p>
        <input type="text" placeholder="Your feedback">
    </section>

</main>

<script src="q3.js"></script>
</body>
</html>
