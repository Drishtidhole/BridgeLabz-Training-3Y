<!DOCTYPE html>
<html>
<head>
    <title>Character Counter</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        textarea {
            width: 300px;
            height: 120px;
        }
        #counter {
            color: green;
        }
        button {
            padding: 8px 15px;
        }
    </style>
</head>
<body>
    <h2>Live Character Counter</h2>
    <textarea id="message" maxlength="100" placeholder="Enter your message"></textarea>
    <p id="counter">100 characters remaining</p>
    <button id="resetButton">Reset</button>

    <script src="q2.js"></script>
</body>
</html>
