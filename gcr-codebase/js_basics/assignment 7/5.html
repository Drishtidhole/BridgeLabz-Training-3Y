<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            gap: 15px;
        }
        .gallery img {
            width: 150px;
            height: 120px;
            object-fit: cover;
            cursor: pointer;
        }
        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        #modal img {
            max-width: 80%;
            max-height: 80%;
        }
    </style>
</head>
<body>
    <h2>Image Gallery</h2>

    <div class="gallery">
        <img src="https://picsum.photos/id/10/400/300" alt="Image 1">
        <img src="https://picsum.photos/id/20/400/300" alt="Image 2">
        <img src="https://picsum.photos/id/30/400/300" alt="Image 3">
        <img src="https://picsum.photos/id/40/400/300" alt="Image 4">
        <img src="https://picsum.photos/id/50/400/300" alt="Image 5">
        <img src="https://picsum.photos/id/60/400/300" alt="Image 6">
    </div>

    <div id="modal">
        <img id="modalImage" src="" alt="Preview">
    </div>

    <script src="q5.js"></script>
</body>
</html>
