<!DOCTYPE html>
<html>
<head>
    <title>Mouse Coordinates</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        #mouseBox {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            background: #f2f2f2;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: red;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <h2>Mouse Coordinates Logger</h2>

    <div id="mouseBox"></div>

    <p id="coordinates">Move your mouse inside the box</p>

    <script src="q7.js"></script>
</body>
</html>
