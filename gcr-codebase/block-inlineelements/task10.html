<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dropdown Selection</title>
</head>
<body>

<h1>Travel Preference Selection</h1>

<form>
  <label for="country">Country:</label>
  <select id="country" name="country">
    <option value="india" selected>India</option>
    <option value="usa">USA</option>
    <option value="japan">Japan</option>
  </select><br><br>

  <label for="state">State:</label>
  <select id="state" name="state">
    <option value="up" selected>Uttar Pradesh</option>
    <option value="maharashtra">Maharashtra</option>
    <option value="kerala">Kerala</option>
  </select><br><br>

  <label for="city">City:</label>
  <select id="city" name="city">
    <option value="agra" selected>Agra</option>
    <option value="mathura">Mathura</option>
    <option value="lucknow">Lucknow</option>
  </select><br><br>

  <label for="place">Favorite Tourist Place:</label>
  <select id="place" name="place">
    <option value="tajmahal" selected>Taj Mahal</option>
    <option value="redfort">Red Fort</option>
    <option value="qutubminar">Qutub Minar</option>
  </select>
</form>

<p>You selected: India, Uttar Pradesh, Agra, and your favorite tourist place is the Taj Mahal.</p>

</body>
</html>
