<!DOCTYPE html>
<html>
<head>
    <title>Question 9 - File Upload Form</title>
</head>
<body>
    <h1>Upload Your Profile Picture</h1>
    <form method="post" action="#" enctype="multipart/form-data">
        <label for="profilepic">Choose an image file:</label>
        <input type="file" id="profilepic" name="profilepic" accept=".jpg,.png" required>
        <br><br>
        <input type="submit" value="Upload">
    </form>
    <p>Note: Only .jpg and .png image files are allowed to be uploaded.</p>
</body>
</html>
