<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=\, initial-scale=1.0">
        <title> Document </title>
    </head>
    <body>
        <h1> Internship Registration Form</h1>
        <form action="/register" method="post">

            <label for="Fullname"> Fullname:</label>
            <input type="text" id="Fullname" , name="Fullname", placeholder="Enter Name"> 
            <br >
            <br >
            <label for="email"> Email:</label>
            <input type="email" id="email" , name="email", placeholder="Enter Email", required>
            <br>
            <br >
            <label for=""> Phone Number:</label>
            <input type="number" id="number" , name="number", placeholder="Enter number">
            <br>
            <br >
            <label for=""> DoB:</label>
            <input type="date" id="Dob", name="Dob", placeholder="Enter DoB">
            <br>
            <br >
             <label for=""> Gender:</label>
             <input type="radio" id="female", name="female",value="female" >
             <label for=""> Female</label>
            <input type="radio" id="male", name="male",value="male" >
             <label for=""> Male</label>
             <br>
             <br >
             <label for=""> Password:</label>
            <input type="password" id="password" , name="password", placeholder="Enter password", required>
            <br>
            <br >
            <label for="course">Course:</label>
            <select name="" id="">
                <option value="CSE" id="" > CSE</option>
                <option value="EC" id="" > EC</option>
                <option value="MECHANICAL" id="" > MECHANICAL</option>
            </select>
            <br>
            <br >
             <label> Skills:</label> <br>
             <input type="checkbox", id="", name="">
             <label for="java">Java</label> 
             <input type="checkbox", id="", name="">
             <label for="python">Python</label> 
             <input type="checkbox", id="", name="">
             <label for="C++">C++</label>
             <br>
             <br >
             <label for="internship">Internship:</label>
              <input type="radio" id="Online", name="Online",value="Online" >
             <label for=""> Online </label>
            <input type="radio" id="Onsite", name="Onsite",value="Onsite" >
             <label for=""> Onsite </label>
             <br>
             <br >
             <label>Resume:</label>
             <input type="file", value="resume", id="resume", required>
             <br>
             <br >
             <label>Coverletter:</label>
             <textarea> </textarea>
             <br>
             <br >
            <label for="submit"></label>
             <input type="submit">
            
        </form>
    </body>
</html>
