<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Gallery</title>
<link rel="stylesheet" href="task6.css">

</head>
<body>
  <h1 class="page-title">Photo Gallery</h1>

  <section class="gallery">
    <figure class="gallery-item">
      <img src="https://picsum.photos/id/1015/400/300" alt="Mountain river landscape">
      <figcaption>Mountain River</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://picsum.photos/id/1025/400/300" alt="Dog looking at camera">
      <figcaption>Curious Dog</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://picsum.photos/id/1035/400/300" alt="Forest path">
      <figcaption>Forest Path</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://picsum.photos/id/1045/400/300" alt="Lake view">
      <figcaption>Lake View</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://picsum.photos/id/1055/400/300" alt="City street">
      <figcaption>City Street</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://picsum.photos/id/1065/400/300" alt="Desert dunes">
      <figcaption>Desert Dunes</figcaption>
    </figure>
  </section>
</body>
</html>
