
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="PersonalPortfolio.css">
</head>
<body class="bg-light text-dark">
    <header class="bg-primary text-white text-center p-5">
        <h1 class="fw-bold">Drishti Dhole</h1>
        <p class="lead mb-0">Software Engineering | Cloud Computing | Web Development</p>
    </header>

    <main class="container my-5">
        <section class="text-center">
            <!-- img-fluid makes the image responsive -->
            <img src="https://i.pravatar.cc/250?img=47"
                 alt="Profile portrait"
                 class="img-fluid rounded-circle profile-img">

            <h2 class="mt-4 mb-3">About Me</h2>
            <p class="mx-auto about-text">
                I enjoy building practical software solutions and learning
                modern web technologies, cloud computing and data structures.
            </p>

            <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
            <a href="cv.pdf" class="btn btn-outline-primary">Download CV</a>
        </section>

        <section class="mt-5" id="contact">
            <h2 class="text-center mb-3">Contact Me</h2>

            <form class="contact-form mx-auto">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" class="form-control"
                           placeholder="Enter your name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control"
                           placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message" class="form-control"
                              rows="3" placeholder="Write your message"
                              required></textarea>
                </div>

                <button type="submit" class="btn btn-success">Send Message</button>
            </form>
        </section>
    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">&copy; 2026 Drishti Dhole</p>
    </footer>
</body>
</html>
