
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="TaskTracker.css">
</head>
<body>
    <header class="bg-primary text-white p-4">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h1 class="h3 mb-0">My Task Tracker</h1>
            <span class="badge bg-danger fs-6">
                Pending <span class="badge bg-light text-dark">3</span>
            </span>
        </div>
    </header>

    <main class="container py-5">
        <section class="card shadow-sm">
            <div class="card-header bg-white">
                <h2 class="h4 mb-0">Today's Tasks</h2>
            </div>

            <!-- Bootstrap list group -->
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between align-items-center gap-3">
                    <span>Complete project report</span>
                    <span class="badge bg-danger">High</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center gap-3">
                    <span>Review Bootstrap components</span>
                    <span class="badge bg-warning text-dark">Medium</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center gap-3">
                    <span>Organize study notes</span>
                    <span class="badge bg-success">Low</span>
                </li>
            </ul>

            <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-3">
                <p class="mb-0">Completed tasks</p>
                <button type="button" class="btn btn-success">
                    Completed <span class="badge bg-light text-dark">5</span>
                </button>
            </div>
        </section>
    </main>

    <footer class="text-center bg-dark text-white p-3">
        <p class="mb-0">Stay organized, stay productive.</p>
    </footer>
</body>
</html>
