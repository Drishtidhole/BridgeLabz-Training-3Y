
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="ProductCatalog.css">
</head>
<body>
    <header class="bg-dark text-white p-4">
        <div class="container">
            <h1 class="text-center">TechStore</h1>
            <p class="text-center mb-0">Technology for everyday life</p>
        </div>
    </header>

    <main class="container py-5">
        <h2 class="text-center mb-4">Featured Products</h2>

        <!-- col-12, col-sm-6 and col-md-3 give 1, 2 and 4 columns -->
        <section class="row g-4">
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card h-100 shadow-sm">
                    <img src="https://picsum.photos/seed/headphones/400/250"
                         class="card-img-top" alt="Wireless headphones">
                    <div class="card-body d-flex flex-column">
                        <h3 class="card-title h5">Wireless Headphones</h3>
                        <p class="text-primary fw-bold">₹1,499</p>
                        <button class="btn btn-primary mt-auto">Add to Cart</button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card h-100 shadow-sm">
                    <img src="https://picsum.photos/seed/smartwatch/400/250"
                         class="card-img-top" alt="Smart watch">
                    <div class="card-body d-flex flex-column">
                        <h3 class="card-title h5">Smart Watch</h3>
                        <p class="text-primary fw-bold">₹2,999</p>
                        <button class="btn btn-primary mt-auto">Add to Cart</button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card h-100 shadow-sm">
                    <img src="https://picsum.photos/seed/speaker/400/250"
                         class="card-img-top" alt="Bluetooth speaker">
                    <div class="card-body d-flex flex-column">
                        <h3 class="card-title h5">Bluetooth Speaker</h3>
                        <p class="text-primary fw-bold">₹999</p>
                        <button class="btn btn-primary mt-auto">Add to Cart</button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card h-100 shadow-sm">
                    <img src="https://picsum.photos/seed/keyboard/400/250"
                         class="card-img-top" alt="Computer keyboard">
                    <div class="card-body d-flex flex-column">
                        <h3 class="card-title h5">Wireless Keyboard</h3>
                        <p class="text-primary fw-bold">₹1,199</p>
                        <button class="btn btn-primary mt-auto">Add to Cart</button>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">&copy; 2026 TechStore</p>
    </footer>
</body>
</html>
