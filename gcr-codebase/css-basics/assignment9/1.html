
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="ResponsiveImageFilterGallery.css">
</head>
<body>
    <header>
        <h1>Image Filter Gallery</h1>
        <p>Hover over images to remove their filters.</p>
    </header>

    <main class="gallery">
        <figure>
            <img class="blur" src="https://picsum.photos/id/1015/400/250" alt="Mountain river">
            <figcaption>Blur Filter</figcaption>
        </figure>

        <figure>
            <img class="grayscale" src="https://picsum.photos/id/1018/400/250" alt="Mountain view">
            <figcaption>Grayscale Filter</figcaption>
        </figure>

        <figure>
            <img class="sepia" src="https://picsum.photos/id/1035/400/250" alt="Forest">
            <figcaption>Sepia Filter</figcaption>
        </figure>

        <figure>
            <img class="brightness" src="https://picsum.photos/id/1043/400/250" alt="Nature">
            <figcaption>Brightness Filter</figcaption>
        </figure>

        <figure>
            <img class="contrast" src="https://picsum.photos/id/1050/400/250" alt="Landscape">
            <figcaption>Contrast Filter</figcaption>
        </figure>

        <figure>
            <img class="hue" src="https://picsum.photos/id/106/400/250" alt="Water">
            <figcaption>Hue-Rotate Filter</figcaption>
        </figure>
    </main>

    <footer>
        <p>CSS Image Filter Gallery</p>
    </footer>
</body>
</html>
