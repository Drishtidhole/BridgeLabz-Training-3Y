
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="FilterComparisonLayout.css">
</head>
<body>
    <header>
        <h1>Image Filter Comparison</h1>
        <p>Compare the original and filtered images.</p>
    </header>

    <main>
        <section class="comparison">
            <figure class="image-card">
                <img src="https://picsum.photos/id/1015/600/400"
                     alt="Original mountain river">
                <figcaption>Before: Original Image</figcaption>
            </figure>

            <figure class="image-card">
                <img class="filtered"
                     src="https://picsum.photos/id/1015/600/400"
                     alt="Brightened mountain river">
                <figcaption>After: Brightness Filter</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>CSS Filter Comparison</p>
    </footer>
</body>
</html>
