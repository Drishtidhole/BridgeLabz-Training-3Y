
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="FilterCardsAnimation.css">
</head>
<body>
    <header>
        <h1>Our Team</h1>
    </header>

    <main>
        <section class="profiles">
            <article class="card">
                <img src="https://i.pravatar.cc/300?img=47" alt="Profile of Aditi">
                <h2>Aditi</h2>
                <p>Web Developer</p>
            </article>

            <article class="card">
                <img src="https://i.pravatar.cc/300?img=12" alt="Profile of Rahul">
                <h2>Rahul</h2>
                <p>UI Designer</p>
            </article>

            <article class="card">
                <img src="https://i.pravatar.cc/300?img=32" alt="Profile of Priya">
                <h2>Priya</h2>
                <p>Cloud Engineer</p>
            </article>
        </section>
    </main>

    <footer>
        <p>Meet Our Team</p>
    </footer>
</body>
</html>
