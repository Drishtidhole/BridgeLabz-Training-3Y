
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Typography</title>
    <link rel="stylesheet" href="ResponsiveTypography.css">
</head>
<body>
    <header>
        <h1>Responsive Typography</h1>
    </header>

    <main>
        <section class="content">
            <h1>Design for Every Screen</h1>

            <p>
                Responsive typography automatically adjusts text size
                according to the screen width. The clamp() function
                sets a minimum size, a flexible preferred size,
                and a maximum size.
            </p>
        </section>
    </main>

    <footer>
        <p>Flexible Text Using CSS</p>
    </footer>
</body>
</html>
