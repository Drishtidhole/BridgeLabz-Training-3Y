
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Design Layout</title>
    <link rel="stylesheet" href="ResponsiveWebDesignLayout.css">
</head>
<body>
    <header class="header">
        <h2 class="logo">MyWebsite</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#features">Features</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main id="home">
        <h1>Welcome to My Website</h1>

        <section class="features" id="features">
            <article class="box">
                <h2>Easy to Use</h2>
                <p>Simple and user-friendly design.</p>
            </article>

            <article class="box">
                <h2>Responsive</h2>
                <p>Works on different screen sizes.</p>
            </article>

            <article class="box">
                <h2>Modern Design</h2>
                <p>Clean layout with smooth effects.</p>
            </article>
        </section>
    </main>

    <footer id="contact">
        <p>Copyright 2026 MyWebsite</p>
    </footer>
</body>
</html>
