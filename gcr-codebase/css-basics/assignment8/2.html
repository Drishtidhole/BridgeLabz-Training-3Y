
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tooltip Demonstration</h1>
        <p>Hover over each item to see its tooltip.</p>
    </header>

    <main class="tooltip-container">
        <div class="tooltip">
            <button>Home</button>
            <span class="tooltip-text">Go to Home</span>
        </div>

        <div class="tooltip">
            <button>Search</button>
            <span class="tooltip-text">Search for items</span>
        </div>

        <div class="tooltip">
            <button>Profile</button>
            <span class="tooltip-text">View your profile</span>
        </div>

        <div class="tooltip">
            <button>Settings</button>
            <span class="tooltip-text">Change settings</span>
        </div>
    </main>

    <footer>
        <p>Tooltips created using CSS only</p>
    </footer>
</body>
</html>
