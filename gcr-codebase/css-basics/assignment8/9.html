
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Combined CSS Effects</h1>
        <p>Hover over the cards and buttons.</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Example One</h2>
            <p>Hover to change the color and size.</p>
            <button class="btn">Explore</button>
        </section>

        <section class="card">
            <h2>Example Two</h2>
            <p>Hover to rotate the card.</p>
            <button class="btn">Discover</button>
        </section>

        <section class="card">
            <h2>Example Three</h2>
            <p>Hover to lift the card.</p>
            <button class="btn">Learn More</button>
        </section>
    </main>

    <footer>
        <p>CSS Transitions and Transformations</p>
    </footer>
</body>
</html>
