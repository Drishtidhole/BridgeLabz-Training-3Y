
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Image Showcase</h1>
    </header>

    <main class="gallery">
        <figure>
            <img src="https://picsum.photos/id/1015/400/250" alt="Mountain river">
            <figcaption>Mountain River</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1018/400/250" alt="Mountain landscape">
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1025/400/250" alt="Dog">
            <figcaption>Lovely Dog</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1035/400/250" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1043/400/250" alt="Nature">
            <figcaption>Beautiful Nature</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/106/400/250" alt="Water">
            <figcaption>Blue Water</figcaption>
        </figure>
    </main>

    <footer>
        <p>Explore the beauty of nature</p>
    </footer>
</body>
</html>
