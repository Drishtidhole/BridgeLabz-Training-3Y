
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS Animation Demonstration</h1>
    </header>

    <main class="animation-container">
        <section class="example">
            <h2>Moving Box</h2>
            <div class="box"></div>
        </section>

        <section class="example">
            <h2>Bouncing Ball</h2>
            <div class="ball"></div>
        </section>

        <section class="example">
            <h2>Color Changing Text</h2>
            <p class="color-text">Amazing CSS!</p>
        </section>
    </main>

    <footer>
        <p>Animations created using CSS keyframes</p>
    </footer>
</body>
</html>
