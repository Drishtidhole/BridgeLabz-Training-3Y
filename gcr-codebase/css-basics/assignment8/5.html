
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Styled Button Collection</h1>
    </header>

    <main>
        <section class="button-container">
            <button class="btn primary">Primary Button</button>
            <button class="btn secondary">Secondary Button</button>
            <button class="btn outline">Outline Button</button>
            <button class="btn disabled" disabled>Disabled Button</button>
        </section>

        <p>Hover, click, or use the Tab key to test button states.</p>
    </main>

    <footer>
        <p>CSS Button Demonstration</p>
    </footer>
</body>
</html>
