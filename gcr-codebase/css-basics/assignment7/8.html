
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="question8.css">
</head>
<body>
    <header>
        <h1>CSS Box Model</h1>
    </header>

    <main>
        <section class="container">
            <article class="demo">
                <div class="margin-layer">
                    <p>Margin: Outer Space</p>

                    <div class="border-layer">
                        <p>Border: Edge of the Box</p>

                        <div class="padding-layer">
                            <p>Padding: Inner Space</p>

                            <div class="content-layer">
                                Content
                            </div>
                        </div>
                    </div>
                </div>
            </article>

            <section class="comparison">
                <h2>Box Sizing Comparison</h2>

                <div class="default-box">
                    Default Box (content-box)
                </div>

                <div class="border-box">
                    Border Box (border-box)
                </div>
            </section>
        </section>
    </main>

    <footer>
        <p>Understanding the CSS Box Model</p>
    </footer>
</body>
</html>
