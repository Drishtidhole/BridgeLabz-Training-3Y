
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="question3.css">
</head>
<body>
    <header>
        <h1>CSS Gradients</h1>
    </header>

    <main>
        <section class="linear">
            <h2>Linear Gradient</h2>
            <p>Colors blend in a straight direction.</p>
        </section>

        <section class="radial">
            <h2>Radial Gradient</h2>
            <p>Colors spread outward from a central point.</p>
        </section>
    </main>

    <footer>
        <p>Gradient Background Demonstration</p>
    </footer>
</body>
</html>
